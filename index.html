<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Achoo Ledger</title>
<meta name="description" content="Tap-to-log sneeze tracker with antihistamine markers. Works offline, syncs to Google Sheets.">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2f7d63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: one-thumb tool. Status strip, giant tap target, pill button, then today's timeline, 14-day chart, data tools. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --line:#dfe5e2; --ink:#18221e; --muted:#5d6b65;
  --sneeze:#2f7d63; --sneeze-ink:#ffffff; --pill:#c4476a; --pill-soft:#f6dde4; --warn:#b3261e;
  --f-ui: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#1a2320; --line:#2b3733; --ink:#e7eeeb; --muted:#93a39c;
  --sneeze:#3f9e7e; --sneeze-ink:#06120d; --pill:#e0708e; --pill-soft:#3a2129; --warn:#f2867d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1a2320; --line:#2b3733; --ink:#e7eeeb; --muted:#93a39c;
  --sneeze:#3f9e7e; --sneeze-ink:#06120d; --pill:#e0708e; --pill-soft:#3a2129; --warn:#f2867d; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.status{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:28px;font-weight:600;line-height:1.1}
.stat span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tap{display:grid;grid-template-columns:1fr;gap:10px}
button{font:inherit;color:inherit;cursor:pointer;border:0;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#sneezeBtn{background:var(--sneeze);color:var(--sneeze-ink);border-radius:28px;height:clamp(200px,38vh,320px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;user-select:none;transition:transform .08s}
#sneezeBtn:active{transform:scale(.98)}
#sneezeBtn .big{font-size:56px;font-weight:700;line-height:1}
#sneezeBtn .lbl{font-size:18px;font-weight:600}
#sneezeBtn .hint{font-size:13px;opacity:.8}
#pillBtn{background:var(--pill-soft);color:var(--pill);border:2px solid var(--pill);border-radius:18px;height:64px;
  font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
#pillBtn.armed{background:var(--pill);color:var(--surface)}
.capsule{width:26px;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--pill) 50%,var(--surface) 50%);border:1.5px solid var(--pill)}
#pillBtn.armed .capsule{border-color:var(--surface)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:14px;
  font-size:14px;max-width:calc(100% - 32px);z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{background:transparent;color:var(--bg);font-weight:700;padding:8px 10px;border-radius:8px;text-decoration:underline}
section h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
section h2 button{text-transform:none;letter-spacing:0;font-size:13px;background:none;color:var(--sneeze);font-weight:600;padding:4px 0}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line);min-height:48px}
.row:first-child{border-top:0}
.row .t{width:64px;flex:none}
.row .what{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--sneeze);flex:none}
.row.p .dot{background:var(--pill);border-radius:3px;width:16px;height:8px}
.row.p .what{color:var(--pill);font-weight:600}
.del{background:none;color:var(--muted);padding:8px 10px;border-radius:8px;font-size:13px}
.del.armed{background:var(--warn);color:var(--surface);font-weight:700}
.empty{padding:16px 14px;color:var(--muted)}
.editing .del{display:inline-block}
.del{display:none}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 10px 8px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:6px 6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools button{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:600}
textarea{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-family:var(--f-num);font-size:12px;padding:10px}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
#danger{color:var(--warn)}
.locbar{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.locbar button{background:none;border-radius:10px;padding:10px 4px;font-weight:600;color:var(--muted);font-size:15px}
.locbar button.on{background:var(--ink);color:var(--bg)}
.locchip{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:auto;white-space:nowrap}
.syncbox{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.syncbox .note{margin:0}
.flabel{font-size:13px;font-weight:600}
.urlrow{display:flex;gap:8px}
.urlrow input{flex:1;min-width:0;font:inherit;font-size:14px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.urlrow button{background:var(--sneeze);color:var(--sneeze-ink);border-radius:12px;padding:0 16px;font-weight:700}
.sstatus{margin:0;font-size:13px;padding-left:16px;position:relative}
.sstatus::before{content:"";position:absolute;left:0;top:5px;width:9px;height:9px;border-radius:50%;background:var(--sneeze)}
.sstatus[data-state="wait"]::before{background:var(--muted)}
.sstatus[data-state="err"]::before{background:var(--warn)}
.sstatus[data-state="err"]{color:var(--warn)}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--sneeze)}
.syncbox .tools button{background:var(--bg)}
@media (prefers-reduced-motion:reduce){#sneezeBtn{transition:none}}
</style>

</head>
<body>
<div class="wrap">
  <div class="locbar" role="radiogroup" aria-label="Where she is now" id="locbar">
    <button role="radio" data-loc="Ljubljana">Ljubljana</button>
    <button role="radio" data-loc="Izola">Izola</button>
    <button role="radio" data-loc="Other">Other</button>
  </div>
  <div class="status" aria-live="polite">
    <div class="stat"><b class="num" id="sToday">0</b><span>Today</span></div>
    <div class="stat"><b class="num" id="sHour">0</b><span>Last 60 min</span></div>
    <div class="stat"><b class="num" id="sPill">–</b><span>Since pill</span></div>
  </div>

  <div class="tap">
    <button id="sneezeBtn" aria-label="Log one sneeze">
      <span class="big">+1</span>
      <span class="lbl">Sneeze</span>
      <span class="hint" id="burstHint">Tap once per sneeze</span>
    </button>
    <button id="pillBtn"><span class="capsule" aria-hidden="true"></span><span id="pillLbl">Antihistamine taken</span></button>
  </div>

  <section>
    <h2><span id="dayLabel">Today</span><button id="editBtn">Edit</button></h2>
    <div class="list" id="list"></div>
  </section>

  <section>
    <h2><span>Last 14 days</span></h2>
    <div class="chart">
      <svg id="chart" viewBox="0 0 340 150" role="img" aria-label="Sneezes per day for the last 14 days"></svg>
      <div class="legend"><span><i style="background:var(--sneeze)"></i>Sneezes</span><span><i style="background:var(--pill)"></i>Pill taken</span></div>
    </div>
  </section>

  <section>
    <h2><span>Data</span></h2>
    <div class="tools">
      <button id="csvBtn">Copy CSV</button>
      <button id="dlBtn">Download CSV</button>
      <button id="jsonBtn">Backup (JSON)</button>
      <button id="importBtn">Restore</button>
      <button id="fsBtn">Full screen</button>
    </div>
    <div id="io" hidden style="margin-top:10px">
      <textarea id="ioText" spellcheck="false"></textarea>
      <div class="tools" style="margin-top:8px">
        <button id="ioAction">Restore from text</button>
        <button id="ioClose">Close</button>
      </div>
    </div>
    <p class="note" id="storeNote">Saved on this phone. Turn on sync below so there is always a copy elsewhere.</p>
  </section>

  <section>
    <h2><span>Backup &amp; sync</span></h2>
    <p class="note" id="frameNote" hidden>Sheet sync and the daily file work in the offline copy of this page on the phone, not here.</p>
    <div id="syncBox" class="syncbox">
      <label for="syncUrl" class="flabel">Google Sheet web app URL</label>
      <div class="urlrow"><input id="syncUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"><button id="syncSave">Save</button></div>
      <p class="sstatus" id="syncStatus" data-state="ok"></p>
      <div class="tools"><button id="syncNow">Sync now</button><button id="syncAll">Resend everything</button></div>
      <label class="check"><input type="checkbox" id="autoBackup"> Save a CSV to Downloads on the first tap each day</label>
      <p class="note" id="lastFile"></p>
    </div>
  </section>
</div>

<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="undoBtn">Undo</button></div>

<script>
(function(){
  const installed=(()=>{ try{ return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches; }catch(e){ return false; } })();
  const KEY='sneezelog.v1';
  const LKEY='sneezelog.loc';
  const LOCS=['Ljubljana','Izola','Other'];
  let loc='Ljubljana';
  try{ const v=localStorage.getItem(LKEY); if(LOCS.includes(v)) loc=v; }catch(e){}
  let data=[]; // {t: ms, k: 's'|'p'}
  let storageOK=true;
  try{ data=JSON.parse(localStorage.getItem(KEY)||'[]'); if(!Array.isArray(data)) data=[]; }catch(e){ storageOK=false; data=[]; }
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

  const $=id=>document.getElementById(id);
  const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(data)); }catch(e){ storageOK=false; $('storeNote').textContent='Storage is blocked here. Entries will be lost when you close the page. Export before leaving.'; } };
  if(!storageOK) $('storeNote').textContent='Storage is blocked here. Entries will be lost when you close the page.';

  const pad=n=>String(n).padStart(2,'0');
  const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes());};
  const dayStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();};
  const iso=t=>{const d=new Date(t);const o=-d.getTimezoneOffset();const s=o>=0?'+':'-';
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+hm(t)+':'+pad(d.getSeconds())+s+pad(Math.floor(Math.abs(o)/60))+':'+pad(Math.abs(o)%60);};
  const ago=ms=>{const m=Math.floor(ms/60000);if(m<60)return m+'m';const h=Math.floor(m/60);return h<48?h+'h'+(m%60?pad(m%60):''):Math.floor(h/24)+'d';};

  // ---------- toast / undo ----------
  let toastTimer=null, undoFn=null;
  function toast(msg,undo){
    $('toastMsg').textContent=msg; undoFn=undo||null; $('undoBtn').hidden=!undo; $('toast').hidden=false;
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>{$('toast').hidden=true;undoFn=null;},4000);
  }
  $('undoBtn').onclick=()=>{ if(undoFn) undoFn(); $('toast').hidden=true; undoFn=null; };

  // ---------- sneeze ----------
  let burst=0, burstTimer=null;
  $('sneezeBtn').onclick=()=>{
    goFull(); maybeDailyBackup(); const e={t:Date.now(),k:'s',l:loc}; addEntry(e);
    try{ navigator.vibrate && navigator.vibrate(25); }catch(_){}
    burst++; clearTimeout(burstTimer); burstTimer=setTimeout(()=>{burst=0;$('burstHint').textContent='Tap once per sneeze';},8000);
    $('burstHint').textContent='This burst: '+burst;
    render();
    toast('Sneeze logged at '+hm(e.t)+(burst>1?' · '+burst+' in a row':''), ()=>{ removeEntry(e); burst=Math.max(0,burst-1); $('burstHint').textContent=burst?'This burst: '+burst:'Tap once per sneeze'; });
  };

  // ---------- pill (two taps to avoid accidental log) ----------
  let pillArmed=null;
  $('pillBtn').onclick=()=>{
    goFull(); const b=$('pillBtn');
    if(!b.classList.contains('armed')){
      b.classList.add('armed'); $('pillLbl').textContent='Tap again to confirm';
      clearTimeout(pillArmed); pillArmed=setTimeout(()=>{b.classList.remove('armed');$('pillLbl').textContent='Antihistamine taken';},3000);
      return;
    }
    clearTimeout(pillArmed); b.classList.remove('armed'); $('pillLbl').textContent='Antihistamine taken';
    maybeDailyBackup(); const e={t:Date.now(),k:'p',l:loc}; addEntry(e);
    try{ navigator.vibrate && navigator.vibrate([40,60,40]); }catch(_){}
    toast('Pill logged at '+hm(e.t), ()=>removeEntry(e));
  };

  function addEntry(e){ data.push(e); save(); qAdd(e); render(); }
  function goFull(){
    try{ const d=document.documentElement;
      if(installed) return;
      if(!document.fullscreenElement && d.requestFullscreen && !inFrame) d.requestFullscreen({navigationUI:'hide'}).catch(()=>{}); }catch(e){}
  }
  $('fsBtn').onclick=()=>{ try{ document.fullscreenElement?document.exitFullscreen():goFull(); }catch(e){} };
  document.addEventListener('fullscreenchange',()=>{ $('fsBtn').textContent=document.fullscreenElement?'Exit full screen':'Full screen'; });
  function removeEntry(e){ const i=data.indexOf(e); if(i>-1){data.splice(i,1);save();qDel(e);render();} }

  // ---------- list with edit mode ----------
  let editing=false;
  $('editBtn').onclick=()=>{ editing=!editing; $('editBtn').textContent=editing?'Done':'Edit'; render(); };

  function renderList(){
    const t0=dayStart(Date.now());
    const today=data.filter(e=>e.t>=t0).sort((a,b)=>b.t-a.t);
    const list=$('list'); list.innerHTML=''; list.classList.toggle('editing',editing);
    if(!today.length){ list.innerHTML='<div class="empty">Nothing logged today. Tap the green button for each sneeze.</div>'; return; }
    // collapse consecutive sneezes within 2 min into one row for reading; edit mode shows each one
    const rows=[];
    for(const e of today){
      const last=rows[rows.length-1];
      if(!editing && e.k==='s' && last && last.k==='s' && (last.items[0].l||'')===(e.l||'') && last.items[last.items.length-1].t-e.t<=120000){ last.items.push(e); }
      else rows.push({k:e.k,items:[e]});
    }
    for(const r of rows){
      const first=r.items[r.items.length-1], lastI=r.items[0];
      const div=document.createElement('div'); div.className='row '+r.k;
      const time=r.items.length>1&&hm(first.t)!==hm(lastI.t)?hm(first.t)+'–'+hm(lastI.t).slice(3):hm(lastI.t);
      const what=r.k==='p'?'Antihistamine':(r.items.length>1?r.items.length+' sneezes':'1 sneeze');
      div.innerHTML='<span class="t num"></span><span class="what"><span class="dot"></span><span></span></span>';
      div.querySelector('.t').textContent=r.items.length>1?hm(first.t):time;
      div.querySelector('.what span:last-child').textContent=what+(r.items.length>1&&hm(first.t)!==hm(lastI.t)?' until '+hm(lastI.t):'');
      const el0=r.items[0].l;
      if(el0 && el0!==loc){ const c=document.createElement('span'); c.className='locchip'; c.textContent=el0; div.querySelector('.what').appendChild(c); }
      if(editing){
        const d=document.createElement('button'); d.className='del'; d.textContent='Delete';
        d.onclick=()=>{
          if(!d.classList.contains('armed')){ d.classList.add('armed'); d.textContent='Confirm'; setTimeout(()=>{d.classList.remove('armed');d.textContent='Delete';},3000); return; }
          const e=r.items[0]; removeEntry(e); toast('Entry deleted', ()=>addEntry(e));
        };
        div.appendChild(d);
      }
      list.appendChild(div);
    }
  }

  // ---------- stats ----------
  function renderLoc(){
    document.querySelectorAll('#locbar button').forEach(b=>{ const on=b.dataset.loc===loc; b.setAttribute('aria-checked',on); b.classList.toggle('on',on); });
  }
  document.querySelectorAll('#locbar button').forEach(b=>b.onclick=()=>{
    if(loc===b.dataset.loc) return;
    loc=b.dataset.loc; try{ localStorage.setItem(LKEY,loc); }catch(e){}
    render(); toast('Location: '+loc+'. New taps are logged here.');
  });
  function renderStats(){
    const now=Date.now(), t0=dayStart(now);
    const s=data.filter(e=>e.k==='s');
    $('sToday').textContent=s.filter(e=>e.t>=t0).length;
    $('sHour').textContent=s.filter(e=>e.t>=now-3600000).length;
    const pills=data.filter(e=>e.k==='p').map(e=>e.t);
    $('sPill').textContent=pills.length?ago(now-Math.max(...pills)):'–';
  }

  // ---------- chart ----------
  function renderChart(){
    const svg=$('chart'), W=340, H=150, L=24, R=6, T=10, B=22, days=14;
    const t0=dayStart(Date.now()), counts=[], pill=[], starts=[];
    for(let i=days-1;i>=0;i--){ const d=new Date(t0); d.setDate(d.getDate()-i); starts.push(d.getTime()); }
    starts.forEach((st,i)=>{ const en=i<days-1?starts[i+1]:st+86400000;
      counts.push(data.filter(e=>e.k==='s'&&e.t>=st&&e.t<en).length);
      pill.push(data.some(e=>e.k==='p'&&e.t>=st&&e.t<en)); });
    const max=Math.max(4,...counts), step=Math.ceil(max/4), top=step*4;
    const pw=W-L-R, ph=H-T-B, bw=pw/days;
    let s='';
    for(let g=0;g<=4;g++){ const y=T+ph-ph*(g/4); s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-4}" y="${y+3}" text-anchor="end">${g*step}</text>`; }
    counts.forEach((c,i)=>{
      const h=ph*c/top, x=L+i*bw+bw*0.18, w=bw*0.64, y=T+ph-h;
      s+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,0)}" rx="2" fill="var(--sneeze)"/>`;
      if(pill[i]) s+=`<rect x="${x+w/2-5}" y="${T+ph+3}" width="10" height="5" rx="2.5" fill="var(--pill)"/>`;
      const d=new Date(starts[i]); if(i%2===days%2||i===days-1) s+=`<text x="${x+w/2}" y="${H-2}" text-anchor="middle">${d.getDate()}</text>`;
    });
    svg.innerHTML=s;
  }

  function render(){ renderLoc(); renderStats(); renderList(); renderChart(); }

  // ---------- export / import ----------
    // ---------- sync to Google Sheet + daily file ----------
  const SKEY='sneezelog.sync.v1';
  const sync={url:'',pending:[],last:0,err:'',autoBackup:true,lastBackupDay:''};
  try{ Object.assign(sync,JSON.parse(localStorage.getItem(SKEY)||'{}')); }catch(e){}
  const saveSync=()=>{ try{ localStorage.setItem(SKEY,JSON.stringify(sync)); }catch(e){} };
  const idOf=e=>e.k+e.t;
  const addOp=e=>({op:'add',id:idOf(e),t:e.t,k:e.k,iso:iso(e.t),l:e.l||''});
  let busy=false, inflight=new Set(), flushTimer=null;
  function schedule(ms){ clearTimeout(flushTimer); flushTimer=setTimeout(flush,ms==null?6000:ms); }
  function qAdd(e){ if(!sync.url) return; sync.pending.push(addOp(e)); saveSync(); renderSync(); schedule(); }
  function qDel(e){
    if(!sync.url) return; const id=idOf(e);
    const i=sync.pending.findIndex(p=>p.op==='add'&&p.id===id&&!inflight.has(p));
    if(i>-1) sync.pending.splice(i,1); else sync.pending.push({op:'del',id});
    saveSync(); renderSync(); schedule();
  }
  async function flush(){
    if(!sync.url||busy||!sync.pending.length||inFrame){ renderSync(); return; }
    if(navigator.onLine===false){ renderSync(); return; }
    busy=true; const batch=sync.pending.slice(0,300); batch.forEach(p=>inflight.add(p)); renderSync();
    let again=false;
    try{
      const r=await fetch(sync.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({ops:batch})});
      const j=await r.json(); if(!j.ok) throw new Error(j.error||'Sheet rejected the data');
      sync.pending=sync.pending.filter(p=>!inflight.has(p)); sync.last=Date.now(); sync.err=''; again=sync.pending.length>0;
    }catch(e){ sync.err=(e&&e.message)||'Could not reach the Sheet'; }
    inflight=new Set(); busy=false; saveSync(); renderSync();
    if(again) flush();
  }
  function renderSync(){
    const el=$('syncStatus'); if(!el) return; const n=sync.pending.length;
    let msg;
    if(!sync.url) msg='Not connected. Paste the Sheet web app URL above.';
    else if(busy) msg='Sending '+n+'…';
    else if(sync.err) msg='Last try failed ('+sync.err+'). '+n+' waiting, will retry.';
    else if(n) msg=(navigator.onLine===false?'Offline. ':'')+n+' waiting to send.';
    else msg=sync.last?'All synced. Last sent '+hm(sync.last)+(dayStart(sync.last)<dayStart(Date.now())?' on '+iso(sync.last).slice(0,10):'')+'.':'Connected. Nothing to send yet.';
    el.textContent=msg; el.dataset.state=sync.err?'err':(n?'wait':'ok');
    $('syncUrl').value=sync.url; $('autoBackup').checked=!!sync.autoBackup;
    $('lastFile').textContent=sync.lastBackupDay?'Last daily file: '+sync.lastBackupDay+'.':'No daily file yet.';
  }
  $('syncSave').onclick=()=>{
    const u=$('syncUrl').value.trim();
    if(u && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){ toast('That is not an Apps Script web app URL. It should end in /exec.'); return; }
    const first=!sync.url&&u; sync.url=u; sync.err='';
    if(!u){ sync.pending=[]; saveSync(); renderSync(); toast('Sync turned off'); return; }
    if(first) sync.pending=data.map(addOp);
    saveSync(); renderSync(); flush(); toast(first?'Connected. Sending '+data.length+' entries.':'Sync URL saved');
  };
  $('syncNow').onclick=()=>{ sync.err=''; flush(); };
  $('syncAll').onclick=()=>{ if(!sync.url) return; const have=new Set(sync.pending.map(p=>p.id+p.op)); data.forEach(e=>{ if(!have.has(idOf(e)+'add')) sync.pending.push(addOp(e)); }); sync.err=''; saveSync(); flush(); toast('Resending everything. The Sheet skips duplicates.'); };
  $('autoBackup').onchange=e=>{ sync.autoBackup=e.target.checked; saveSync(); };
  function maybeDailyBackup(){
    if(inFrame||!sync.autoBackup||!data.length) return;
    const today=iso(Date.now()).slice(0,10); if(sync.lastBackupDay===today) return;
    try{ downloadCsv(true); sync.lastBackupDay=today; saveSync(); renderSync(); }catch(e){}
  }

  const sorted=()=>data.slice().sort((a,b)=>a.t-b.t);
  const csv=()=>'timestamp_local,unix_ms,event,location\n'+sorted().map(e=>iso(e.t)+','+e.t+','+(e.k==='s'?'sneeze':'antihistamine')+','+(e.l||'')).join('\n');
  function copy(text,label){
    const show=()=>{ $('io').hidden=false; $('ioText').value=text; $('ioText').select(); $('ioAction').hidden=true; };
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=>toast(label+' copied ('+data.length+' entries)'),()=>{show();toast('Select all and copy the text below');});
    } else { show(); toast('Select all and copy the text below'); }
  }
  $('csvBtn').onclick=()=>copy(csv(),'CSV');
  $('jsonBtn').onclick=()=>copy(JSON.stringify(sorted()),'Backup');
  function downloadCsv(auto){
    const blob=new Blob([csv()],{type:'text/csv'}); const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='achoo-ledger-'+iso(Date.now()).slice(0,10)+(auto?'-auto':'')+'.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }
  $('dlBtn').onclick=()=>{ try{ downloadCsv(false); toast('Saved to Downloads. If nothing happened, use Copy CSV.'); }catch(e){ copy(csv(),'CSV'); } };
  $('importBtn').onclick=()=>{ $('io').hidden=false; $('ioText').value=''; $('ioText').placeholder='Paste a JSON backup here'; $('ioAction').hidden=false; $('ioText').focus(); };
  $('ioClose').onclick=()=>{ $('io').hidden=true; };
  $('ioAction').onclick=()=>{
    try{
      const arr=JSON.parse($('ioText').value);
      if(!Array.isArray(arr)) throw 0;
      const seen=new Set(data.map(e=>e.t+e.k)); let n=0;
      for(const e of arr){ if(e&&typeof e.t==='number'&&(e.k==='s'||e.k==='p')&&!seen.has(e.t+e.k)){ const ne={t:e.t,k:e.k}; if(typeof e.l==='string'&&e.l) ne.l=e.l; data.push(ne); qAdd(ne); seen.add(e.t+e.k); n++; } }
      save(); render(); $('io').hidden=true; toast('Restored '+n+' new entries');
    }catch(e){ toast('That text is not a valid backup. Paste the full JSON from “Backup”.'); }
  };

  if(installed) $('fsBtn').hidden=true;
  if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
  let inFrame=true; try{ inFrame=window.self!==window.top; }catch(e){}
  if(inFrame){ $('dlBtn').hidden=true; $('fsBtn').hidden=true; $('syncBox').hidden=true; $('frameNote').hidden=false; }

  // One-time setup link: …/#sync=<Apps Script /exec URL>. The hash never reaches the server.
  try{
    const m=location.hash.match(/^#sync=(.+)$/);
    if(m){
      const u=decodeURIComponent(m[1]).trim();
      history.replaceState(null,'',location.pathname+location.search);
      if(/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){
        const first=!sync.url; sync.url=u; sync.err='';
        if(first) sync.pending=data.map(addOp);
        saveSync(); setTimeout(()=>toast('Sheet sync is set up'),300);
      } else setTimeout(()=>toast('That setup link is broken. Ask for a new one.'),300);
    }
  }catch(e){}
  render(); renderSync(); flush();
  window.addEventListener('online',flush);
  setInterval(()=>{ if(sync.pending.length) flush(); },60000);
  setInterval(renderStats,30000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ render(); flush(); } });
})();
</script>

</body>
</html>
